apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ct003-tob-uf-generator-httproute
  namespace: ct003-tob-uf-v1
spec:
  parentRefs:
    - name: tgaprod-gw
      namespace: kgateway-system
      sectionName: https
  hostnames:
    - "tgaprod910.toruslowcode.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ct003/trs/tob/v1
      backendRefs:
        - name: ct003-tob-uf-generator
          port: 443