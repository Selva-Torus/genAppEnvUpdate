apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ct005-rtgs-uf-generator-httproute
  namespace: ct005-rtgs-uf-v1
spec:
  parentRefs:
    - name: tgaprod-gw
      namespace: kgateway-system
      sectionName: https
  hostnames:
    - "tgaprod910.toruslowcode.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ct005/gss/rtgs/v1
      backendRefs:
        - name: ct005-rtgs-uf-generator
          port: 443