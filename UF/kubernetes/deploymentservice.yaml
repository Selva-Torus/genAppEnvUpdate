apiVersion: apps/v1
kind: Deployment
metadata:
  name: ct003-tag-uf-generator
  namespace: ct003-tag-uf-v1
  labels:
    app: ct003-tag-uf-generator
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: ct003-tag-uf-generator
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ct003-tag-uf-generator
    spec:
      containers:
      - name: ct003-tag-uf-generator-frontend-container
        image: 192.168.2.164:5000/ct003-tag-uf-v1:docker_tag
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
        env:
          - name: NEXT_PUBLIC_API_BASE_URL
            value: "https://tgaprod910.toruslowcode.com/ct003/tag/tag/v1/api"
          - name: NEXT_PUBLIC_TENANT_CODE
            value: "CT003"
          - name: NEXT_PUBLIC_APPGROUPCODE
            value: "TAG"
          - name: NEXT_PUBLIC_APPCODE
            value: "TAG"
          - name: NEXT_PUBLIC_TORUS_API_URL
            value: "https://tgaprod910.toruslowcode.com/ct003/tag/tag/v1/api/"
          - name: REDIS_HOST
            value: "192.168.2.192"
          - name: REDIS_PORT
            value: "32055"
          - name: ENCRYPTIONKEY
            value: "w9dH6b9t3JH9L4MvqIgFbq12H2nm8D9AoG7j0ZCxOrk="
          - name: ENCRYPTIONIVLENGTH
            value: "MTIzNDU2Nzg5MDEyMzQ1Ng=="
          - name: ENCRYPTIONMODE
            value: "aes-256-ctr"
          - name: NEXT_PUBLIC_FTP_OUTPUT_HOST
            value: "https://tdps3api.toruslowcode.com"
          - name: NEXT_PUBLIC_BASE_PATH
            value: "/ct003/tag/tag/v1"
          - name: NEXT_PUBLIC_DFS_BUCKETNAME
            value: "torus9x-mobile-app-test"
          - name: NEXT_PUBLIC_DFS_PATH
            value: "ct003/tag/tag/v1"
          - name: AUTH_SECRET
            value: "X5N8QdC9wVFfmofF3i3nPTIlTskZan5v/acbVXgyos1c"
          - name: NEXT_PUBLIC_IS_SAAS_APPLICATION
            value: "true" 
          - name: NEXT_PUBLIC_APP_URL
            value: "https://tgaprod910.toruslowcode.com"
          - name: INTERNAL_SERVICE_KEY
            value: "torus_verified_server_credentials_call"
---
apiVersion: v1
kind: Service
metadata:
  name: ct003-tag-uf-generator
  namespace: ct003-tag-uf-v1
  labels:
    app: ct003-tag-uf-generator
spec:
  selector:
    app: ct003-tag-uf-generator
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
    - name: https
      protocol: TCP
      port: 443
      targetPort: 3000
  type: ClusterIP