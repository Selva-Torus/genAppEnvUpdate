apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ct005-rtgs-df-generator-httproute
  namespace: ct005-rtgs-df-v1
spec:
  parentRefs:
    - name: tgaprod-gw
      namespace: kgateway-system
      sectionName: https  
  hostnames:
    - "tgaprod910.toruslowcode.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ct005/gss/rtgs/v1/api/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: ct005-rtgs-df-generator
          port: 443   
    - matches:
        - path:
            type: Exact
            value: /ct005/gss/rtgs/v1/api     
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /
      backendRefs:
        - name: ct005-rtgs-df-generator
          port: 443