apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ct003-rf-df-generator-httproute
  namespace: ct003-rf-df-v1
spec:
  parentRefs:
    - name: tgatest-gw
      namespace: kgateway-system
      sectionName: https  
  hostnames:
    - "tgatest910.toruslowcode.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ct003/trs/rf/v1/api/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: ct003-rf-df-generator
          port: 443 
          
      timeouts:
        request: 600s  
    - matches:
        - path:
            type: Exact
            value: /ct003/trs/rf/v1/api     
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /
      backendRefs:
        - name: ct003-rf-df-generator
          port: 443

      timeouts:
        request: 600s