

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ct003-tag-df-generator
  namespace: ct003-tag-df-v1
  labels:
    app: ct003-tag-df-generator
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: ct003-tag-df-generator
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ct003-tag-df-generator
    spec:
      containers:
      - name: ct003-tag-df-generator-backend-container
        image: 192.168.2.164:5000/ct003-tag-df-v1:docker_tag
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
        env:
          - name: HOST
            value: "192.168.2.192"
          - name: PORT
            value: "32055"
          - name: REDISUSER
            value: "admin"
          - name: REDISPASSWORD
            value: "Admin@123"
          - name: REDIS_SENTINEL_HOST
            value: "redis-sentinel.torus-bl.svc.cluster.local"
          - name: REDIS_SENTINEL_PORT
            value: "26379"
          - name: REDIS_MASTER_NAME
            value: "mymaster"
          - name: REDIS_USERNAME
            value: "admin"
          - name: REDIS_PASSWORD
            value: "Admin@123"
          - name: PKEY
            value: ""
          - name: LOGTYPE
            value: "dfs"
          - name: PO_PORT
            value: "3003"
          - name: DATABASE_URL
            value: "postgresql://postgres:Torus@123@192.168.2.192:30032/torus9x?schema=ct003_tag"
          - name: APP_PORT
            value: "3000"
          - name: AES_KEY
            value: "5GzrMrAv1Ntv+aMUC92wZqj4KYgEZNZotP8x5+CA3+o="
          - name: AES_IV
            value: "cWHSLKWwQVoXj6DFusw7Ug=="
          - name: REDIS_AES_KEY
            value: "TOru/S+Ro6IvZ3xWijD5W7Joc+kpIuTmjUn6Rq5lhhI="
          - name: API_URL
            value: ""
          - name: BE_URL
            value: "https://tgaprod910.toruslowcode.com/ct003/tag/tag/v1/api"
          - name: MONGODB_URL
            value: "mongodb://admin:Torus%40123@192.168.2.192:32017/Torus9x?authSource=admin&directConnection=true"
          - name: MONGODB_NAME
            value: "Torus9x"
          - name: OUTBOUND_HOST_ALLOWLIST
            value: "tgaprod910.toruslowcode.com,tdpfsdev.toruslowcode.com,tade-api.toruslowcode.com,tamprod910api.toruslowcode.com"
          - name: APPGROUPCODE
            value: "TAG"
          - name: APPCODE
