---
apiVersion: v1
kind: Service
metadata:
  name: ct003-tag-df-generator
  namespace: ct003-tag-df-v1
  labels:
    app: ct003-tag-df-generator
spec:
  selector:
    app: ct003-tag-df-generator
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
    - name: https
      protocol: TCP
      port: 443
      targetPort: 3000
  type: ClusterIP