          - name: CLIENTCODE
            value: "CT003"
          - name: APPNAME
            value: ""
          - name: APPGROUPNAME
            value: ""
          - name: VERSION
            value: "v1"
          - name: MY_CRON
            value: "*/50 * * * * *"
          - name: TIMEZONE
            value: "UTC"
          - name: DATEFORMAT
            value: "YYYY-MM-DD HH:mm:ss"
          - name: TOURS_APP_API_BASE_URL
            value: "https://tgadev.toruslowcode.com/tt001/Torus20261/Torus202601/v1/api/"
          - name: PG_URL
